[tool.uv.workspace]
members = ["backend"]

[project]
name = "seneschal"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "N"]
ignore = ["E501"]

[project.dependencies]
dependencies = [
    "markdown>=3.6",
    "weasyprint>=62.0",
    "pygments>=2.18",   # para codehilite (syntax highlighting)
]
