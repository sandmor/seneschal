[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.1",
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "pycrdt>=0.13.0",
    "pycrdt-websocket>=0.16.1",
    "websockets>=15.0.1",
    "pyjwt>=2.10.1",
    "reportlab>=4.5.0",
    "markdown>=3.6",
    "playwright>=1.43.0",
    "pygments>=2.18",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
